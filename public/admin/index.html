<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>管理画面</title>
  </head>
  <body>
    <script src="https://unpkg.com/netlify-identity-widget@2.0.3/build/netlify-identity-widget.js"></script>
    <!-- Keep the CMS version deterministic: minor releases can change authentication at runtime. -->
    <script src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
